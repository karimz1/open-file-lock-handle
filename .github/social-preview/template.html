<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>oflh social preview</title>
<style>
  /* Brand tokens mirror oflh-website/src/styles.css (dark theme) and public/brand.css. */
  @font-face {
    font-family: "Inter";
    src: url("Inter-subset.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --bg: #101113;
    --surface: #1a1c20;
    --border: #34373f;
    --text: #f0f1f4;
    --text-dim: #b5bac4;
    --text-faint: #979da8;
    --accent: #4264db;
    --accent-light: #98b0f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }

  /* Background: faint grid + soft brand glow behind the screenshot. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    -webkit-mask-image: radial-gradient(ellipse 75% 90% at 72% 45%, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse 75% 90% at 72% 45%, #000 30%, transparent 80%);
  }
  .glow {
    position: absolute;
    width: 900px; height: 700px;
    left: 560px; top: -40px;
    background: radial-gradient(closest-side, rgba(66,100,219,.36), rgba(66,100,219,.10) 55%, transparent 100%);
    filter: blur(10px);
  }

  /* Left column: all text stays well inside a 40px safe margin. */
  .copy {
    position: absolute;
    left: 72px; top: 64px; bottom: 64px;
    width: 560px;
    display: flex; flex-direction: column;
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 46px; height: 46px; display: block; }
  .wordmark { font-size: 32px; font-weight: 750; letter-spacing: -1.4px; line-height: 1; }
  .wordmark .dot { color: var(--accent-light); }
  .brand .sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
  .brand .full { font-size: 17px; font-weight: 500; color: var(--text-dim); letter-spacing: -0.1px; }

  h1 {
    margin-top: 92px;
    font-size: 64px;
    line-height: 1.06;
    font-weight: 800;
    letter-spacing: -2.4px;
  }
  h1 .accent {
    background: linear-gradient(100deg, #b4c6f8 0%, #7d98ef 55%, #5f7fe6 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 24px;
    font-size: 22px;
    line-height: 1.45;
    font-weight: 450;
    color: var(--text-dim);
    letter-spacing: -0.2px;
    max-width: 500px;
  }
  .meta {
    margin-top: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(26,28,32,.85);
    font-size: 15px; font-weight: 550; color: var(--text-dim);
  }
  .chip svg { width: 15px; height: 15px; fill: currentColor; }
  .chip.oss { color: var(--accent-light); border-color: rgba(66,100,219,.55); background: rgba(66,100,219,.12); }

  /* Right side: real desktop screenshot, tilted slightly, bleeding off the right and bottom. */
  .stage {
    position: absolute;
    left: 668px; top: 96px;
    perspective: 2200px;
    z-index: 1;
  }
  .window {
    width: 880px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid #3a3e48;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.4),
      0 40px 80px -20px rgba(0,0,0,.75),
      0 0 120px -30px rgba(66,100,219,.45);
    transform: rotateY(-8deg) rotateX(2.5deg) rotateZ(0.4deg);
    transform-origin: left center;
  }
  .window .bar {
    height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 13px;
    background: #17181c; border-bottom: 1px solid #2a2d34;
  }
  .window .bar span { margin-left: 8px; font: 500 11px/1 Inter, system-ui, sans-serif; color: #737887; letter-spacing: .2px; }
  .window .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3d45; display: block; }
  .window .bar i:nth-child(1){background:#ff5f57;} .window .bar i:nth-child(2){background:#febc2e;} .window .bar i:nth-child(3){background:#28c840;}
  .window img { display: block; width: 100%; height: auto; }

  /* Terminal app card overlapping the lower left of the desktop window. */
  .term {
    position: absolute;
    left: 604px; top: 356px;
    width: 400px;
    border-radius: 12px;
    overflow: hidden;
    background: #1b1b26;
    border: 1px solid #3d3f52;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.5);
    z-index: 3;
  }
  .term .bar {
    height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 11px;
    background: #15151d; border-bottom: 1px solid #2c2d3c;
    font: 500 11px/1 Inter, system-ui, sans-serif; color: #737887; letter-spacing: .2px;
  }
  .term .bar i { width: 9px; height: 9px; border-radius: 50%; background: #363847; display: block; }
  .term .bar i:nth-child(1){background:#ff5f57;} .term .bar i:nth-child(2){background:#febc2e;} .term .bar i:nth-child(3){background:#28c840;}
  .term .bar span { margin-left: 8px; }
  .term img { display: block; width: 100%; height: auto; }
  .term .body { padding: 6px 4px 8px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="stage">
    <div class="window">
      <div class="bar"><i></i><i></i><i></i><span>Desktop app</span></div>
      <img src="../../images/desktop.png" alt="">
    </div>
  </div>

  <div class="term">
    <div class="bar"><i></i><i></i><i></i><span>Terminal app · process tree</span></div>
    <div class="body"><img src="terminal-ancestry.png" alt=""></div>
  </div>

  <main class="copy">
    <div class="brand">
      <img src="../../crates/oflh-desktop/app-icon.svg" alt="">
      <span class="wordmark">oflh<span class="dot">.</span></span>
      <span class="sep"></span>
      <span class="full">Open File Lock Handle</span>
    </div>

    <h1>Find what’s using your <span class="accent">file or port.</span></h1>

    <p class="sub">Desktop and terminal app that shows which process holds a file, folder, or port.</p>

    <div class="meta">
      <span class="chip">Windows</span>
      <span class="chip">Linux</span>
      <span class="chip">macOS</span>
      <span class="chip oss">Open source · MIT</span>
    </div>
  </main>
</body>
</html>
