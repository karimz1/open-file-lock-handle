name: Reveal probe
# Temporary diagnostic for #202: which Explorer launch methods select a file on a hosted runner.
on:
  pull_request:
    paths: ['.github/workflows/reveal-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Try each reveal method
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Sh {
            [DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr ILCreateFromPathW(string p);
            [DllImport("shell32.dll")] public static extern void ILFree(IntPtr p);
            [DllImport("shell32.dll")] public static extern int SHOpenFolderAndSelectItems(IntPtr f, uint c, IntPtr[] i, uint fl);
            [DllImport("ole32.dll")] public static extern int CoInitializeEx(IntPtr r, uint f);
          }
          "@
          function Selected {
            $shell = New-Object -ComObject Shell.Application
            @($shell.Windows() | Where-Object { $_.Document -and $_.Document.Folder } | ForEach-Object {
              "$($_.Document.Folder.Self.Path) => [" + (@($_.Document.SelectedItems() | ForEach-Object { $_.Path }) -join ',') + "]"
            })
          }
          function CloseAll {
            (New-Object -ComObject Shell.Application).Windows() | Where-Object { $_.Document -and $_.Document.Folder } | ForEach-Object { $_.Quit() }
            Start-Sleep 2
          }
          Write-Host "elevated=" ((New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          Write-Host "OS" (Get-CimInstance Win32_OperatingSystem).Caption
          $root = Join-Path $env:RUNNER_TEMP 'probe'
          foreach ($n in 'a','b','c','d') {
            New-Item -ItemType Directory -Force "$root\$n" | Out-Null
            foreach ($f in 'alpha.txt','beta.txt','gamma.txt') { Set-Content "$root\$n\$f" 'x' }
          }
          function WaitSel($label, $dir, $file) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt 30) {
              $s = Selected
              if ($s -match [regex]::Escape($file)) { Write-Host "$label SELECTED after $([int]$sw.Elapsed.TotalSeconds)s :: $s"; return }
              Start-Sleep 1
            }
            Write-Host "$label NOT selected in 30s :: $(Selected)"
          }
          function ShSelect($dir, $file) {
            $ps = [powershell]::Create()
            $rs = [runspacefactory]::CreateRunspace(); $rs.ApartmentState = 'STA'; $rs.Open(); $ps.Runspace = $rs
            [void]$ps.AddScript({
              param($dir, $file)
              $folder = [Sh]::ILCreateFromPathW($dir); $item = [Sh]::ILCreateFromPathW($file)
              "hr=" + [Sh]::SHOpenFolderAndSelectItems($folder, 1, @($item), 0)
            }).AddArgument($dir).AddArgument($file)
            Write-Host "SHOpenFolderAndSelectItems" ($ps.Invoke())
          }
          # A. explorer /select with no Explorer window open
          CloseAll
          Write-Host "windows before A:" (Selected).Count
          Start-Process explorer.exe -ArgumentList "/select,`"$rootlpha.txt`""
          WaitSel "A explorer /select (none open)" "$root\a" "alpha.txt"
          # B. SHOpenFolderAndSelectItems with no window open
          CloseAll
          ShSelect "$root\b" "$root\b\beta.txt"
          WaitSel "B SHOpen (none open)" "$root\b" "beta.txt"
          # C. unrelated window open first, then /select
          CloseAll
          Start-Process explorer.exe -ArgumentList "`"$root\d`""
          Start-Sleep 5
          Start-Process explorer.exe -ArgumentList "/select,`"$root\c\gamma.txt`""
          WaitSel "C explorer /select (other window open)" "$root\c" "gamma.txt"
          # D. unrelated window open first, then SHOpen
          CloseAll
          Start-Process explorer.exe -ArgumentList "`"$root\d`""
          Start-Sleep 5
          ShSelect "$root\c" "$root\c\alpha.txt"
          WaitSel "D SHOpen (other window open)" "$root\c" "alpha.txt"
          # E. same folder already open, then SHOpen
          CloseAll
          Start-Process explorer.exe -ArgumentList "`"$root\b`""
          Start-Sleep 5
          ShSelect "$root\b" "$root\b\gamma.txt"
          WaitSel "E SHOpen (same folder open)" "$root\b" "gamma.txt"
          # F. cmd.exe launch of explorer /select (non-Start-Process)
          CloseAll
          cmd /c start "" explorer.exe /select,"$root\a\gamma.txt"
          WaitSel "F cmd start explorer /select (none open)" "$root\a" "gamma.txt"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = New-Object System.Drawing.Bitmap([System.Windows.Forms.SystemInformation]::VirtualScreen.Width, [System.Windows.Forms.SystemInformation]::VirtualScreen.Height)
          [System.Drawing.Graphics]::FromImage($b).CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:RUNNER_TEMP\probe.png")
      - uses: actions/upload-artifact@v7
        with:
          name: reveal-probe
          path: ${{ runner.temp }}/probe.png
          retention-days: 1
