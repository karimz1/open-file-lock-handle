name: Desktop
on:
  pull_request:
  push:
    branches: [main, feature/oflh-desktop-rc, 'release/**']
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload optional desktop downloads and UI reports with one-day retention
        type: boolean
        default: false
      administrator_only:
        description: Run only the six native administrator-recovery jobs
        type: boolean
        default: false
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    inputs:
      upload_artifacts:
        description: Upload all desktop downloads and receipts for downstream release jobs
        type: boolean
        default: false
      version:
        type: string
        default: dev
permissions:
  contents: read
jobs:
  administrator-recovery:
    name: Administrator recovery / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x86-64, runner: ubuntu-24.04, os: linux}
          - {label: Linux ARM64, runner: ubuntu-24.04-arm, os: linux}
          - {label: macOS Intel, runner: macos-15-intel, os: darwin}
          - {label: macOS Apple Silicon, runner: macos-15, os: darwin}
          - {label: Windows x86-64, runner: windows-2025, os: windows}
          - {label: Windows ARM64, runner: windows-11-arm, os: windows}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Linux native build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: rustup show
      - run: npm ci && npm run build
        working-directory: crates/oflh-desktop/ui
      - name: Build headless helper and test service transitions
        run: |
          cargo build -p oflh-desktop --features desktop --locked
          cargo test -p oflh-desktop --lib --locked administrator_recovery
          cargo test -p oflh-platform --lib --locked elevation
      - name: Exercise native helper with privileged and denied requests
        env:
          OFLH_ADMIN_HELPER_EXE: ${{ github.workspace }}/target/debug/oflh-desktop${{ matrix.os == 'windows' && '.exe' || '' }}
        run: cargo test -p oflh-desktop --locked --test elevation packaged_helper_validates_identity_permissions_and_force_action -- --ignored
  frontend:
    if: ${{ !inputs.administrator_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require updater signing key before building
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Desktop CI requires TAURI_SIGNING_PRIVATE_KEY, including development and RC builds."
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check workspace lockfile
        run: cargo check --workspace --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/oflh-desktop/ui/package-lock.json
      - run: npm ci
        working-directory: crates/oflh-desktop/ui
      - name: Verify updater signing key against the app public key
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPDATER_PRIVATE_KEY" > "$RUNNER_TEMP/updater-preflight.key"
          chmod 600 "$RUNNER_TEMP/updater-preflight.key"
          trap 'rm -f "$RUNNER_TEMP/updater-preflight.key"' EXIT
          printf 'OFLH updater signing preflight\n' > "$RUNNER_TEMP/updater-preflight"
          npm run tauri -- signer sign -f "$RUNNER_TEMP/updater-preflight.key" "$RUNNER_TEMP/updater-preflight"
          cargo xtask verify-updater-signature --config ../tauri.conf.json --payload "$RUNNER_TEMP/updater-preflight" --signature "$RUNNER_TEMP/updater-preflight.sig"
        working-directory: crates/oflh-desktop/ui
      - run: npm run format:check && npm run build && npm test && npx playwright install --with-deps chrome && npm run test:ui
        working-directory: crates/oflh-desktop/ui
      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.upload_artifacts }}
        with:
          name: desktop-ui-report
          path: |
            crates/oflh-desktop/ui/playwright-report/
            crates/oflh-desktop/ui/test-results/
          retention-days: 1
  native:
    needs: frontend
    name: Desktop / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, label: 'Linux x86-64 (linux/amd64)', runner: ubuntu-24.04, bundles: 'deb,rpm'}
          - {os: linux, arch: arm64, label: 'Linux ARM64 (linux/arm64)', runner: ubuntu-24.04-arm, bundles: 'deb,rpm'}
          - {os: darwin, arch: amd64, label: 'macOS Intel (darwin/amd64)', runner: macos-15-intel, bundles: 'app,dmg'}
          - {os: darwin, arch: arm64, label: 'macOS Apple Silicon (darwin/arm64)', runner: macos-15, bundles: 'app,dmg'}
          - {os: windows, arch: amd64, label: 'Windows x86-64 (windows/amd64)', runner: windows-2025, bundles: nsis}
          - {os: windows, arch: arm64, label: 'Windows ARM64 (windows/arm64)', runner: windows-11-arm, bundles: nsis}
    env:
      RELEASE_TAG: ${{ inputs.version || 'dev' }}
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      # Release-branch pushes and PRs into release/** always publish one
      # downloadable build per main platform (Linux RPM, Windows x64, macOS ARM).
      RELEASE_BRANCH_DOWNLOAD: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/'))) && ((matrix.os == 'linux' && matrix.arch == 'amd64') || (matrix.os == 'windows' && matrix.arch == 'amd64') || (matrix.os == 'darwin' && matrix.arch == 'arm64')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/oflh-desktop/ui/package-lock.json
      - name: Linux WebView build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf xvfb
      - run: rustup show
      - run: npm ci && npm run build
        working-directory: crates/oflh-desktop/ui
      - name: Native desktop lint and regression tests
        run: |
          cargo fmt --all --check
          cargo clippy -p oflh-desktop --all-targets --features desktop --locked -- -D warnings
          cargo test -p oflh-desktop --features updater-tests --locked
      - name: Set traceable build identity and matching installer version
        run: |
          OFLH_VERSION=$(cargo xtask ci-version --version "$RELEASE_TAG" --commit "$BUILD_COMMIT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" --pr-number "$PR_NUMBER" --github-env "$GITHUB_ENV")
          printf '{"version":"%s"}\n' "$OFLH_VERSION" > "$RUNNER_TEMP/desktop-version.json"
      - name: Build desktop release executable
        run: npm run tauri -- build --config "$RUNNER_TEMP/desktop-version.json" --no-bundle -- --locked
        working-directory: crates/oflh-desktop/ui
      - name: Verify built desktop version
        run: test "$(./target/release/oflh-desktop${{ matrix.os == 'windows' && '.exe' || '' }} --version | head -n 1)" = "oflh-desktop $OFLH_VERSION"
      - name: Test packaged administrator helper on the native target
        env:
          OFLH_ADMIN_HELPER_EXE: ${{ github.workspace }}/target/release/oflh-desktop${{ matrix.os == 'windows' && '.exe' || '' }}
        run: cargo test -p oflh-desktop --locked --test elevation packaged_helper_validates_identity_permissions_and_force_action -- --ignored
      - name: Smoke-test native app startup
        env:
          APP_PATH: ./target/release/oflh-desktop${{ matrix.os == 'windows' && '.exe' || '' }}
          APP_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          app_path = os.environ["APP_PATH"]
          if os.environ["APP_OS"] == "linux":
              command = ["timeout", "--signal=TERM", "--kill-after=5s", "15s", "xvfb-run", "-a", app_path]
              result = subprocess.run(command, check=False, timeout=25)
              if result.returncode != 124:
                  raise SystemExit(f"Desktop app exited during startup with status {result.returncode}")
          else:
              process = subprocess.Popen([app_path])
              try:
                  process.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  pass
              else:
                  raise SystemExit(f"Desktop app exited during startup with status {process.returncode}")
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY
      - name: Prepare updater signing key
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: crates/oflh-desktop/ui
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Desktop CI requires TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          echo "::add-mask::$UPDATER_PRIVATE_KEY"
          if [ -n "$UPDATER_PRIVATE_KEY_PASSWORD" ]; then
            echo "::add-mask::$UPDATER_PRIVATE_KEY_PASSWORD"
          fi
          # Use files so multiline key material is never written to the environment file.
          printf '%s' "$UPDATER_PRIVATE_KEY" > "$RUNNER_TEMP/updater-signing.key"
          chmod 600 "$RUNNER_TEMP/updater-signing.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater-signing.key" >> "$GITHUB_ENV"
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<OFLH_UPDATER_PASSWORD'
            printf '%s\n' "$UPDATER_PRIVATE_KEY_PASSWORD"
            echo 'OFLH_UPDATER_PASSWORD'
          } >> "$GITHUB_ENV"
      - name: Bundle the built executable without rebuilding
        run: npm run tauri -- bundle --config "$RUNNER_TEMP/desktop-version.json" --no-binary-patching --bundles '${{ matrix.bundles }}'
        working-directory: crates/oflh-desktop/ui
      - name: Check the generated NSIS script
        if: matrix.os == 'windows'
        run: |
          python - <<'PY'
          import pathlib
          import re

          scripts = list(pathlib.Path("target/release/nsis").glob("*/installer.nsi"))
          if len(scripts) != 1:
              raise SystemExit(f"expected one generated installer.nsi, found {scripts}")
          text = scripts[0].read_text(encoding="utf-8-sig")
          # NSIS falls back to the first inserted language for display
          # languages it has no table for, so English must come first.
          languages = re.findall(r'^!insertmacro MUI_LANGUAGE "(\w+)"', text, re.M)
          if languages != ["English", "German", "SimpChinese"]:
              raise SystemExit(f"unexpected installer languages {languages}")
          for name in ["installer-hooks.nsh", "English.nsh", "German.nsh", "SimpChinese.nsh"]:
              if not re.search(r'^\s*!include "[^"]*' + re.escape(name) + '"', text, re.M):
                  raise SystemExit(f"{name} is not included")
          for define in ["SIDEBARIMAGE", "HEADERIMAGE", "INSTALLERICON"]:
              if re.search(r'^!define ' + define + r' ""', text, re.M):
                  raise SystemExit(f"{define} is empty")
          print(f"{scripts[0]}: languages {languages}, hooks, language files and artwork present")
          PY
      - name: Collect desktop packages separately from CLI artifacts
        env:
          RELEASE_TAG: ${{ inputs.version || 'dev' }}
        run: cargo xtask package-desktop --version "$RELEASE_TAG" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --binary target/release/oflh-desktop${{ matrix.os == 'windows' && '.exe' || '' }} --bundle-dir target/release/bundle --output desktop-dist
      - name: Verify real packaged updater download and signature
        if: matrix.os != 'linux'
        env:
          OFLH_UPDATER_PACKAGE: ${{ github.workspace }}/desktop-dist/oflh-desktop.${{ matrix.os }}.${{ matrix.arch }}${{ matrix.os == 'windows' && '-installer.exe' || '.app.tar.gz' }}
        run: cargo test -p oflh-desktop --features updater-tests --locked --test updater actual_packaged_update_is_detected_and_downloaded -- --ignored
      # Linux packages are required by the installation and archive smoke jobs,
      # even when optional build uploads are disabled.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'linux'
        with:
          name: oflh-desktop.linux.${{ matrix.arch }}.tar.gz
          archive: false
          path: desktop-dist/oflh-desktop.linux.${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'linux'
        with:
          name: oflh-desktop.linux.${{ matrix.arch }}.deb
          archive: false
          path: desktop-dist/oflh-desktop.linux.${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'linux'
        with:
          name: oflh-desktop.linux.${{ matrix.arch }}.rpm
          archive: false
          path: desktop-dist/oflh-desktop.linux.${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts && matrix.os == 'darwin'
        with:
          archive: false
          path: desktop-dist/oflh-desktop.darwin.${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts && matrix.os == 'darwin'
        with:
          archive: false
          path: desktop-dist/oflh-desktop.darwin.${{ matrix.arch }}.app.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts && matrix.os == 'darwin'
        with:
          archive: false
          path: desktop-dist/oflh-desktop.darwin.${{ matrix.arch }}.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts && matrix.os == 'windows'
        with:
          archive: false
          path: desktop-dist/oflh-desktop.windows.${{ matrix.arch }}-installer.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts && matrix.os == 'windows'
        with:
          archive: false
          path: desktop-dist/oflh-desktop.windows.${{ matrix.arch }}-installer.exe.sig
          if-no-files-found: error
          retention-days: 1
      - name: Stage release-branch download
        id: release-download
        if: env.RELEASE_BRANCH_DOWNLOAD == 'true'
        run: |
          case '${{ matrix.os }}' in
            linux) source=desktop-dist/oflh-desktop.linux.amd64.rpm; suffix=linux-x86_64.rpm ;;
            windows) source=desktop-dist/oflh-desktop.windows.amd64-installer.exe; suffix=windows-x64-setup.exe ;;
            darwin) source=desktop-dist/oflh-desktop.darwin.arm64.dmg; suffix=macos-apple-silicon.dmg ;;
          esac
          test -s "$source"
          # OFLH_VERSION already carries PR, run and SHA; keep only the base version.
          version=${OFLH_VERSION%%-*}
          name="oflh-${version}-${BUILD_COMMIT::7}-${suffix}"
          mkdir -p release-download
          cp "$source" "release-download/$name"
          echo "path=release-download/$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: env.RELEASE_BRANCH_DOWNLOAD == 'true'
        with:
          archive: false
          path: ${{ steps.release-download.outputs.path }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts
        with:
          name: desktop-receipt-${{ matrix.os }}-${{ matrix.arch }}
          path: desktop-dist/*.manifest
          if-no-files-found: error
          retention-days: 1

  prune-tester-builds:
    name: Delete older tester builds of this branch or PR
    needs: native
    # Only after every native job, including the three tester uploads, succeeded.
    # Fork PRs get a read-only token, so they skip instead of failing.
    if: >-
      ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
          (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete tester artifacts from older runs of the same branch or PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Only runs of this workflow, same branch and event, strictly older than this run.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/desktop.yml/runs?branch=$(jq -rn --arg b "$BRANCH" '$b|@uri')&event=$EVENT&per_page=100" \
            --jq ".workflow_runs[] | select(.id < $CURRENT_RUN) | .id" |
          while read -r run; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | select(.name | test("^oflh-.*-(linux-x86_64\\.rpm|macos-apple-silicon\\.dmg|windows-x64-setup\\.exe)$")) | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting $name from run $run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
          done

  package-smoke:
    needs: native
    name: Install ${{ matrix.format }} on ${{ matrix.distribution }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 24.04
            format: DEB
            arch: amd64
            runner: ubuntu-24.04
            container: ubuntu:24.04
            artifact: oflh-desktop.linux.amd64.deb
          - distribution: Ubuntu 24.04
            format: DEB
            arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:24.04
            artifact: oflh-desktop.linux.arm64.deb
          - distribution: Fedora
            format: RPM
            arch: amd64
            runner: ubuntu-24.04
            container: fedora:latest
            artifact: oflh-desktop.linux.amd64.rpm
          - distribution: Fedora
            format: RPM
            arch: arm64
            runner: ubuntu-24.04-arm
            container: fedora:latest
            artifact: oflh-desktop.linux.arm64.rpm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: package
      - name: Install DEB package
        if: matrix.format == 'DEB'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y xvfb xauth
          apt-get install -y ./package/*.deb
          dpkg-query --show oflh-desktop
      - name: Install RPM package
        if: matrix.format == 'RPM'
        run: |
          dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth
          dnf install -y ./package/*.rpm
          rpm --query oflh-desktop
      - name: Verify installed app and desktop icon
        run: |
          oflh-desktop --version
          desktop_file=$(grep -rl 'OFLH Desktop' /usr/share/applications --include='*.desktop' | head -n 1)
          test -n "$desktop_file"
          icon_name=$(sed -n 's/^Icon=//p' "$desktop_file" | head -n 1)
          test -n "$icon_name"
          if [[ "$icon_name" = /* ]]; then
            test -s "$icon_name"
          else
            find /usr/share/icons /usr/share/pixmaps -type f \
              \( -name "$icon_name.png" -o -name "$icon_name.svg" -o -name "$icon_name.xpm" \) \
              -print -quit | grep -q .
          fi
      - name: Smoke-test installed app as unprivileged user
        run: |
          useradd --create-home smoke
          set +e
          su -s /bin/bash smoke -c 'timeout --signal=TERM --kill-after=5s 15s xvfb-run -a oflh-desktop'
          result=$?
          set -e
          test "$result" -eq 124

  archive-smoke:
    needs: native
    name: Linux archive / ${{ matrix.distribution }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distribution: Ubuntu, arch: amd64, runner: ubuntu-24.04, container: 'ubuntu:24.04'}
          - {distribution: Ubuntu, arch: arm64, runner: ubuntu-24.04-arm, container: 'ubuntu:24.04'}
          - {distribution: Fedora, arch: amd64, runner: ubuntu-24.04, container: 'fedora:latest'}
          - {distribution: Fedora, arch: arm64, runner: ubuntu-24.04-arm, container: 'fedora:latest'}
          - {distribution: Arch, arch: amd64, runner: ubuntu-24.04, container: 'archlinux:base'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oflh-desktop.linux.${{ matrix.arch }}.tar.gz
          path: archive
      - name: Install Ubuntu runtime dependencies
        if: matrix.distribution == 'Ubuntu'
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0t64 xvfb xauth fonts-dejavu-core passwd util-linux tar gzip
      - name: Install Fedora runtime dependencies
        if: matrix.distribution == 'Fedora'
        run: dnf install -y webkit2gtk4.1 gtk3 xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts shadow-utils util-linux tar gzip
      - name: Install Arch runtime dependencies
        if: matrix.distribution == 'Arch'
        run: pacman -Syu --noconfirm webkit2gtk-4.1 gtk3 xorg-server-xvfb xorg-xauth ttf-dejavu shadow util-linux tar gzip
      - name: Extract and inspect the standalone archive
        run: |
          tar -xzf archive/oflh-desktop.linux.${{ matrix.arch }}.tar.gz
          test -x oflh-desktop/oflh-desktop
          test -s oflh-desktop/LICENSE
          test -s oflh-desktop/README.txt
          test -s oflh-desktop/icon.png
          ./oflh-desktop/oflh-desktop --version
          ldd ./oflh-desktop/oflh-desktop > archive/dependencies.txt
          if grep -q 'not found' archive/dependencies.txt; then
            cat archive/dependencies.txt
            exit 1
          fi
      - name: Launch the extracted app as an unprivileged user
        run: |
          useradd --create-home smoke
          # Use a traversable location instead of runner-owned workspace directories.
          cp -r oflh-desktop /tmp/oflh-archive-smoke
          chmod -R a+rX /tmp/oflh-archive-smoke
          set +e
          su -s /bin/bash smoke -c 'timeout --signal=TERM --kill-after=5s 15s xvfb-run -a /tmp/oflh-archive-smoke/oflh-desktop'
          result=$?
          set -e
          test "$result" -eq 124

  # Real multi-user / terminal-server E2E (separate from the native build matrix).
  # Free GitHub-hosted runners only. First runs are observational — see the PR
  # "Verify on first run" list before making this job required.
  multiuser-e2e:
    name: Multi-user E2E / ${{ matrix.os }}
    if: ${{ !inputs.administrator_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup show

      - name: Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Build multiuser E2E binary
        run: cargo test -p oflh-desktop --test multiuser --no-run --locked

      - name: Locate multiuser test binary
        id: bin
        run: |
          BIN=$(ls -1 target/debug/deps/multiuser-* 2>/dev/null | grep -v '\.d$' | head -1)
          test -n "$BIN" && test -x "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "multiuser binary: $BIN"

      # ── Windows ──────────────────────────────────────────────────────────
      - name: Windows — create test users
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\multiuser\windows.ps1 -Stage users

      - name: Windows — second-user file holder (owner annotation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\multiuser\windows.ps1 -Stage owner

      - name: Windows — SMB share opened by a third user
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\multiuser\windows.ps1 -Stage share

      - name: Windows — enable RDP loopback
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\multiuser\windows.ps1 -Stage rdp

      - name: Windows — second interactive session (RDP client chain)
        id: win_session
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: .\.github\scripts\multiuser\windows.ps1 -Stage session

      - name: Windows — annotate when the second session was unavailable
        if: runner.os == 'Windows' && steps.win_session.outcome == 'failure'
        run: |
          echo "::warning title=Second RDP session unavailable::No headless client produced an Active session on this runner. Sign-out / send-message E2E is skipped here; SMB, owner, non-admin and mocked tests stay blocking."

      - name: Windows — SMB opens before the test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-SmbOpenFile | Format-Table FileId, ClientUserName, ClientComputerName, Path -AutoSize | Out-String -Width 300 | Write-Host
          openfiles.exe /query /v /fo list 2>&1 | Write-Host

      - name: Windows — elevated multiuser E2E
        if: runner.os == 'Windows'
        env:
          OFLH_MULTIUSER_E2E: '1'
          OFLH_E2E_ELEVATED: '1'
        run: |
          cargo test -p oflh-desktop --test multiuser --locked -- --ignored --nocapture --test-threads=1 --skip second_session_message_and_sign_out

      # Non-blocking while the loopback RDP fixture settles. Make this step
      # required (drop continue-on-error) after about 5 consecutive green runs.
      - name: Windows — second session message and sign-out (non-blocking)
        id: win_sign_out
        if: runner.os == 'Windows' && steps.win_session.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          OFLH_MULTIUSER_E2E: '1'
          OFLH_E2E_ELEVATED: '1'
          OFLH_E2E_SIGN_OUT: '1'
        run: |
          quser.exe 2>&1 | Out-Host
          cargo test -p oflh-desktop --test multiuser --locked -- --ignored --nocapture --test-threads=1 --exact second_session_message_and_sign_out

      # continue-on-error reports the step as success; surface the real outcome.
      - name: Windows — report the second-session test result
        if: always() && runner.os == 'Windows' && steps.win_session.outcome == 'success'
        env:
          OUTCOME: ${{ steps.win_sign_out.outcome }}
        run: |
          echo "second_session_message_and_sign_out outcome: $OUTCOME"
          echo "### Windows second-session test: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo "::warning title=Second-session test ${OUTCOME}::second_session_message_and_sign_out did not pass (outcome: ${OUTCOME}). The step is non-blocking; see its log."
          fi

      - name: Windows — non-admin pass (Requires administrator rights)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OFLH_E2E_TEST_EXE: ${{ steps.bin.outputs.path }}
        run: .\.github\scripts\multiuser\windows.ps1 -Stage nonadmin

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Linux — create test user
        if: runner.os == 'Linux'
        run: bash .github/scripts/multiuser/linux.sh users

      - name: Linux — second-user file holder (owner annotation)
        if: runner.os == 'Linux'
        run: bash .github/scripts/multiuser/linux.sh owner

      - name: Linux — logind session (systemd-run PAMName=login, else ssh)
        id: linux_session
        if: runner.os == 'Linux'
        continue-on-error: true
        run: bash .github/scripts/multiuser/linux.sh session

      - name: Linux — annotate when logind session was unavailable
        if: runner.os == 'Linux' && steps.linux_session.outcome == 'failure'
        run: |
          echo "::warning title=logind session unavailable::PAMName=login / ssh localhost did not register a session. Sign-out E2E is skipped here; owner and non-root gating stay blocking."

      - name: Linux — elevated (root) multiuser E2E
        if: runner.os == 'Linux'
        env:
          OFLH_MULTIUSER_E2E: '1'
          OFLH_E2E_ELEVATED: '1'
          OFLH_E2E_SIGN_OUT: ${{ steps.linux_session.outcome == 'success' && '1' || '0' }}
        run: |
          # geteuid()==0 is required for sign-out / cross-user reads on Linux.
          # Run the already-built test binary so cargo does not rebuild as root.
          sudo --preserve-env=OFLH_MULTIUSER_E2E,OFLH_E2E_ELEVATED,OFLH_E2E_SIGN_OUT,OFLH_E2E_USER,OFLH_E2E_FILE,OFLH_E2E_PID,OFLH_E2E_SESSION_USER,OFLH_E2E_SESSION_FILE,OFLH_E2E_SESSION_PID \
            "${{ steps.bin.outputs.path }}" --ignored --nocapture --test-threads=1

      - name: Linux — non-root pass (Requires root)
        if: runner.os == 'Linux'
        env:
          OFLH_E2E_TEST_EXE: ${{ steps.bin.outputs.path }}
        run: bash .github/scripts/multiuser/linux.sh nonadmin

      # ── macOS ────────────────────────────────────────────────────────────
      - name: macOS — create test user
        if: runner.os == 'macOS'
        run: bash .github/scripts/multiuser/macos.sh users

      - name: macOS — second-user file holder (owner annotation only)
        if: runner.os == 'macOS'
        run: bash .github/scripts/multiuser/macos.sh owner

      - name: macOS — elevated multiuser E2E (owner only; no remote sign-out)
        if: runner.os == 'macOS'
        env:
          OFLH_MULTIUSER_E2E: '1'
          OFLH_E2E_ELEVATED: '1'
          OFLH_E2E_SIGN_OUT: '0'
        run: |
          # The runner user is an admin but not root. macOS only lets root read
          # another user's open files (proc_pidinfo), so run the already-built
          # test binary as root, like the Linux step.
          sudo --preserve-env=OFLH_MULTIUSER_E2E,OFLH_E2E_ELEVATED,OFLH_E2E_SIGN_OUT,OFLH_E2E_USER,OFLH_E2E_FILE,OFLH_E2E_PID \
            "${{ steps.bin.outputs.path }}" --ignored --nocapture --test-threads=1

      - name: macOS — non-admin pass (informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          OFLH_E2E_TEST_EXE: ${{ steps.bin.outputs.path }}
        run: bash .github/scripts/multiuser/macos.sh nonadmin

      # ── Shared cleanup / diagnostics ─────────────────────────────────────
      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) pwsh -File .github/scripts/multiuser/windows.ps1 -Stage diagnostics ;;
            Linux)   bash .github/scripts/multiuser/linux.sh diagnostics ;;
            macOS)   bash .github/scripts/multiuser/macos.sh diagnostics ;;
          esac

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: multiuser-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/oflh-multiuser-diag
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup fixtures
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) pwsh -File .github/scripts/multiuser/windows.ps1 -Stage cleanup ;;
            Linux)   bash .github/scripts/multiuser/linux.sh cleanup ;;
            macOS)   bash .github/scripts/multiuser/macos.sh cleanup ;;
          esac
