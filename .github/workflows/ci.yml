name: CI
on:
  push:
    branches: [main, architecture/redesign-in-rust]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload CLI downloads with one-day retention
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload CLI downloads for downstream release jobs
        type: boolean
        default: false
      version:
        type: string
        default: dev
permissions:
  contents: read
jobs:
  lockfile:
    name: Cargo lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check workspace lockfile
        run: cargo check --workspace --locked
  test:
    needs: lockfile
    name: Native Rust TUI + scanner / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, label: 'Linux x86-64 (linux/amd64)', runner: ubuntu-24.04}
          - {os: linux, arch: arm64, label: 'Linux ARM64 (linux/arm64)', runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, label: 'macOS Intel (darwin/amd64)', runner: macos-15-intel}
          - {os: darwin, arch: arm64, label: 'macOS Apple Silicon (darwin/arm64)', runner: macos-15}
          - {os: windows, arch: amd64, label: 'Windows x86-64 (windows/amd64)', runner: windows-2025}
          - {os: windows, arch: arm64, label: 'Windows ARM64 (windows/arm64)', runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RELEASE_TAG: ${{ inputs.version || 'dev' }}
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and native lock tests
        run: cargo test --workspace --exclude oflh --locked
      - name: Real terminal workflow
        run: cargo test -p oflh --locked
      - name: Repeat real terminal workflow
        run: |
          cargo test -p oflh --test terminal --locked
          cargo test -p oflh --test terminal --locked
      - name: Check out comparison baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .profile-base
          persist-credentials: false
      - name: Build native fixture profilers
        run: |
          cargo build --release --locked --manifest-path .profile-base/Cargo.toml -p oflh-platform --example scan_bench
          cargo build --release --locked -p oflh-platform --example inspection_profile
      - name: Compare native inspection with equivalent fixture coverage
        run: |
          mkdir -p inspection-profiles
          ./target/release/examples/inspection_profile${{ matrix.os == 'windows' && '.exe' || '' }} --baseline .profile-base/target/release/examples/scan_bench${{ matrix.os == 'windows' && '.exe' || '' }} --whole-disk --budget-seconds 120 > inspection-profiles/${{ matrix.os }}-${{ matrix.arch }}.json
      - name: Upload native inspection measurements
        uses: actions/upload-artifact@v7
        with:
          name: inspection-profile-${{ matrix.os }}-${{ matrix.arch }}
          path: inspection-profiles/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Set traceable build identity
        run: |
          cargo xtask ci-version --version "$RELEASE_TAG" --commit "$BUILD_COMMIT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" --pr-number "$PR_NUMBER" --github-env "$GITHUB_ENV"
      - name: Build release executable only
        run: |
          cargo build --release --locked --bin oflh
          test "$(./target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }} --version | head -n 1)" = "oflh $OFLH_VERSION"
          ./target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }} --help
      - name: Package tested executable
        run: cargo xtask package --version "$RELEASE_TAG" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --binary target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts
        with:
          archive: false
          path: dist/oflh-cli.*
          if-no-files-found: error
          retention-days: 1
  inspection-summary:
    name: Compare six native inspection profiles
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: inspection-profile-*
          path: inspection-profiles
          merge-multiple: true
      - name: Summarize native coverage and timings
        run: cargo xtask inspection-summary --input inspection-profiles --output inspection-summary.md
      - name: Publish comparison in the workflow summary
        run: cat inspection-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: inspection-summary
          path: inspection-summary.md
          retention-days: 14
