name: CI
on:
  push:
    branches: [main, architecture/redesign-in-rust]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
permissions:
  contents: read
jobs:
  test:
    name: Native Rust TUI + scanner / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RELEASE_TAG: ${{ inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the shared display version
        run: |
          cargo xtask validate --version "$RELEASE_TAG"
          if [ "$RELEASE_TAG" = dev ]; then
            echo 'OFLH_VERSION=development' >> "$GITHUB_ENV"
          else
            echo "OFLH_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and native lock tests
        run: cargo test --workspace --exclude oflh --locked
      - name: Real terminal workflow
        run: cargo test -p oflh --locked
      - name: Repeat real terminal workflow
        run: |
          cargo test -p oflh --test terminal --locked
          cargo test -p oflh --test terminal --locked
      - name: Build release executable only
        run: |
          cargo build --release --locked --bin oflh
          test "$(./target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }} --version)" = "oflh $OFLH_VERSION"
          ./target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }} --help
      - name: Package tested executable
        run: cargo xtask package --version "$RELEASE_TAG" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --binary target/release/oflh${{ matrix.os == 'windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/oflh-cli.*
          if-no-files-found: error
          retention-days: 7
