name: Social preview
on:
  pull_request:
    paths:
      - '.github/social-preview/**'
      - 'images/desktop.png'
      - 'crates/oflh-desktop/app-icon.svg'
      - '.github/workflows/social-preview.yml'
  push:
    branches: [main]
    paths:
      - '.github/social-preview/**'
      - 'images/desktop.png'
      - 'crates/oflh-desktop/app-icon.svg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    name: Render social preview card
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use the Playwright version pinned by the desktop UI
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('./crates/oflh-desktop/ui/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-shell-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright outside the repository
        run: |
          npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Render without missing images, fonts, or page errors
        run: node .github/social-preview/render.cjs .github/social-preview/template.html "$RUNNER_TEMP/social-preview.png"
      - name: Check size and dimensions
        run: |
          node - "$RUNNER_TEMP/social-preview.png" <<'JS'
          const fs = require("fs");
          const png = fs.readFileSync(process.argv[2]);
          const fail = (msg) => { console.error(`::error file=.github/social-preview/template.html::${msg}`); process.exit(1); };
          if (png.toString("latin1", 1, 4) !== "PNG" || png.toString("latin1", 12, 16) !== "IHDR") fail("output is not a PNG");
          const [w, h] = [png.readUInt32BE(16), png.readUInt32BE(20)];
          if (w !== 1280 || h !== 640) fail(`card is ${w}x${h}, expected 1280x640`);
          const kb = Math.round(png.length / 1024);
          if (kb < 50 || kb > 1024) fail(`card is ${kb} KB, expected 50 KB to 1 MB`);
          console.log(`ok: ${w}x${h}, ${kb} KB`);
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: social-preview
          path: ${{ runner.temp }}/social-preview.png
          if-no-files-found: ignore
          retention-days: 14
