name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0); select this tag as the workflow ref
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require website publishing credential
        env:
          WEBSITE_TOKEN: ${{ secrets.OFLH_WEBSITE_TOKEN }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo '::error::Set OFLH_WEBSITE_TOKEN with Contents write access to karimz1/oflh-website.'
            exit 1
          fi
      - name: Require the selected tag to match this workflow revision
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo xtask validate --version "$TAG"
          test "$TAG" != dev
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
  test:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifacts: true
      version: ${{ inputs.tag || github.ref_name }}
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      upload_artifacts: true
      version: ${{ inputs.tag || github.ref_name }}
  homebrew:
    needs: [test, desktop]
    name: Homebrew / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: oflh-cli.*
          merge-multiple: true
          path: dist
      - name: Prepare the real release formula with local executable URLs
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo xtask assemble --version "$TAG" --formula "$RUNNER_TEMP/oflh.rb" --base-url "file://$PWD/dist"
      - name: Install and test the generated formula
        shell: bash
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new karimz1/open-file-lock-handle-ci --no-git
          cp "$RUNNER_TEMP/oflh.rb" "$(brew --repository karimz1/open-file-lock-handle-ci)/Formula/oflh.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula karimz1/open-file-lock-handle-ci/oflh
          HOMEBREW_NO_AUTO_UPDATE=1 brew test karimz1/open-file-lock-handle-ci/oflh
  draft:
    needs: [test, homebrew, desktop]
    runs-on: ubuntu-24.04
    concurrency:
      group: updater-website-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: oflh-cli.*
          merge-multiple: true
          path: dist
      - name: Verify all six targets and generate checksums and Homebrew formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo xtask assemble --version "$TAG" --formula "$RUNNER_TEMP/oflh.rb"
          cd dist
          sha256sum --check checksums.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: oflh-desktop.*
          merge-multiple: true
          path: desktop-dist
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-receipt-*
          merge-multiple: true
          path: desktop-dist
      - name: Verify both interfaces and assemble direct release downloads
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo xtask assemble-release --version "$TAG" --cli-dir dist --desktop-dir desktop-dist --output release-dist
          cd release-dist
          sha256sum --check checksums.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease --latest=false); fi
          if gh release view "$TAG" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            if [[ "$TAG" == *-* ]]; then
              gh release edit "$TAG" "${PRERELEASE[@]}"
            fi
          else
            gh release create "$TAG" --verify-tag --draft "${PRERELEASE[@]}" --title "OFLH $TAG" --notes-file .github/release-notes/downloads.md --generate-notes
          fi
          mkdir -p updater-dist
          # Keep the legacy endpoint working for installed apps and the CLI.
          # The website receives the exact same signed updater metadata.
          cp release-dist/latest.json updater-dist/latest.json
          gh release upload "$TAG" release-dist/* --clobber
          echo '### Release ready for review' >> "$GITHUB_STEP_SUMMARY"
          echo 'All platform jobs passed. The release remains a draft until you publish it.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out static website
        uses: actions/checkout@v7
        with:
          repository: karimz1/oflh-website
          ref: main
          path: updater-website
          token: ${{ secrets.OFLH_WEBSITE_TOKEN }}
      - name: Commit versioned updater manifest to website
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/sync-updater.sh updater-website updater-dist/latest.json "$TAG" stage
