name: Publish static updater endpoint
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: updater-website-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out static website
        uses: actions/checkout@v7
        with:
          repository: karimz1/oflh-website
          ref: main
          path: updater-website
          token: ${{ secrets.OFLH_WEBSITE_TOKEN }}
      - name: Promote the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/karimz1/open-file-lock-handle/releases/latest --jq .tag_name)
          # The published release is the source of truth, even if draft staging failed.
          mkdir -p published-updater
          gh release download "$TAG" --repo karimz1/open-file-lock-handle --pattern latest.json --dir published-updater
          bash .github/scripts/sync-updater.sh updater-website published-updater/latest.json "$TAG" publish
