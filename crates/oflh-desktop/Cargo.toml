[package]
name = "oflh-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Enables Tauri mock-runtime helpers only for the updater integration test run.
updater-tests = ["desktop", "tauri/test"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-single-instance"]

[dependencies]
oflh-core.workspace = true
oflh-platform.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror.workspace = true
url = "2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

# Windows only: a second launch (Explorer "Inspect file/folder") hands its target to
# the running window. On Linux the plugin needs a D-Bus session bus and panics without one.
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2.4", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bin]]
name = "oflh-desktop"
path = "src/main.rs"
required-features = ["desktop"]
