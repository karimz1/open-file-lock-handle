[package]
name = "oflh-platform"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Developer probes only; the distributed CLI/desktop never enable this feature.
native-query-experiment = []

[[example]]
name = "windows_native_probe"
required-features = ["native-query-experiment"]

[dependencies]
netstat2 = "0.11.2"
oflh-core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_System_IO", "Wdk_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Memory"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
cc = "1"
